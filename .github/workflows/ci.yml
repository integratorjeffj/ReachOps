name: ReachOps validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://reachops:reachops@localhost:5432/reachops
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reachops
          POSTGRES_PASSWORD: reachops
          POSTGRES_DB: reachops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reachops -d reachops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Test
        run: pnpm test

      - name: Validate database schema
        run: pnpm db:validate

      # The published demonstration renders a committed snapshot. Regenerating it here proves the
      # committed copy is still the exact output of the fixtures and the deterministic services.
      - name: Verify the demonstration snapshot is current
        run: |
          pnpm demo:snapshot
          git diff --exit-code -- apps/web/src/lib/demo/snapshot.generated.json apps/web/src/lib/demo/search.generated.json apps/web/src/lib/demo/social.generated.json apps/web/src/lib/demo/content.generated.json

      - name: Build
        run: pnpm build

      - name: Build the static demonstration
        env:
          REACHOPS_DEMO_MODE: static
        run: pnpm exec turbo build --filter=@reachops/web
