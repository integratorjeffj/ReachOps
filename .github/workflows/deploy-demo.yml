name: Publish ReachOps demonstration

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; queued runs supersede each other rather than racing.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The published demonstration reads the committed deterministic snapshot instead of the API,
      # so this build needs neither PostgreSQL nor the NestJS service.
      REACHOPS_DEMO_MODE: static
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo builds @reachops/contracts first. The web app does not depend on @reachops/database,
      # so no Prisma client generation is required here.
      - name: Build the static demonstration
        run: pnpm exec turbo build --filter=@reachops/web

      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
